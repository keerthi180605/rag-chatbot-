<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RAG Chatbot</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 35px;
        }

        .upload-section {
            border: 2px dashed #888;
            padding: 35px;
            text-align: center;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .upload-section h2 {
            margin-bottom: 20px;
        }

        input[type="file"] {
            margin-bottom: 15px;
        }

        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        button {
            background: #1976d2;
            color: white;
            border: none;
            padding: 12px 22px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #125aa0;
        }

        .status {
            margin-top: 15px;
            font-weight: bold;
        }

        .answer {
            margin-top: 20px;
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            min-height: 40px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🤖 RAG Chatbot</h1>

    <!-- Upload Document -->
    <div class="upload-section">

        <h2>Upload Document</h2>

        <input
            type="file"
            id="fileInput"
            accept=".txt"
        >

        <br>

       <button onclick="uploadDocument()">
    Upload Document
</button>

        <div id="uploadStatus" class="status"></div>

    </div>


    <!-- Ask Question -->

    <h2>Ask a Question</h2>

    <input
        type="text"
        id="questionInput"
        placeholder="Ask something about your document..."
    >

    <button onclick="askQuestion()">
        Ask
    </button>

    <div id="answer" class="answer">
        Your answer will appear here.
    </div>

</div>


<script>

    // Upload document
    async function uploadDocument() {
        

        const fileInput = document.getElementById("fileInput");
        const status = document.getElementById("uploadStatus");

        if (!fileInput.files.length) {

            status.innerText = "Please select a document.";

            return;
        }

        const file = fileInput.files[0];

        const formData = new FormData();

        formData.append("file", file);


        try {

            status.innerText = "Uploading...";

            const response = await fetch(
                "http://127.0.0.1:8000/upload",
                {
                    method: "POST",
                    body: formData
                }
            );


            const data = await response.json();


            if (!response.ok) {

                status.innerText =
                    "Upload failed: " +
                    (data.detail || "Unknown error");

                return;
            }


            status.innerText =
                data.message +
                " (" +
                data.chunks +
                " chunks)";


        } catch (error) {

            status.innerText =
                "Upload failed: " +
                error.message;
        }
    }



    // Ask question
    async function askQuestion() {

        const questionInput =
            document.getElementById("questionInput");

        const answer =
            document.getElementById("answer");


        const question =
            questionInput.value.trim();


        if (!question) {

            answer.innerText =
                "Please enter a question.";

            return;
        }


        answer.innerText = "Thinking...";


        try {

            const response = await fetch(
                "http://127.0.0.1:8000/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        question: question
                    })
                }
            );


            const data = await response.json();


            if (!response.ok) {

                answer.innerText =
                    "Error: " +
                    (data.detail || "Something went wrong.");

                return;
            }


            answer.innerText =
                data.answer;


        } catch (error) {

            answer.innerText =
                "Error connecting to chatbot: " +
                error.message;
        }
    }

</script>

</body>
</html>
